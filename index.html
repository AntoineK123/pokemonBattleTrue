<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my-pokemon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="/src/main.ts" defer></script>

</head>

<body class="flex flex-col justify-center items-center gap-6 bg-white">

  <!-- une colonne du grid principale qui va contenir tout le jeu capé à 1000 px de width -->
  <div>
    <div id="playpause" class="h-[30px] w-[30px]">
      <img src="./public/logos/playpause.svg">
    </div>
  </div>
  <!-- une colonne du grid principale qui va contenir tout le jeu capé à 1000 px de width -->
  <div class="grid grid-cols-[1fr_minmax(0,1000px)_1fr] gap-4 bg-white">

    <!-- aside vide pour retraicir le jeu -->
    <aside></aside>

    <!-- l'écran global du jeu , il englobe tout et est delimité par des border qui rapell pokemon -->
    <main class="pokeborder">

      <!-- titre de l'interface de jeu en cours -->
      <div class="flex flex-col justify-center items-center h-[50px]">
        <p id="pTitle"></p>
      </div>
      <!-- l'écran global du jeu , il englobe tout et est delimité par des border qui rapelle pokemon -->
      <div id="mainDiv"></div>

      <!-- div qui contient un bouton en bas pour notamment revenir dans les menus -->
      <div id="bottomButDiv" class="flex flex-col justify-center items-center h-[50px]">
      </div>
    </main>

    <!-- aside vide pour retraicir le jeu -->
    <aside></aside>

  </div>

</body>


</html>
